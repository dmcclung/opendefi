[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
# Arbitrum Orbit chains (Robinhood Chain) support Cancun opcodes.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 1000

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"
